services:
  dns-server:
    container_name: dns-server
    hostname: dns-server
    image: docker.io/technitium/dns-server:latest
    ports:
      - "5380:5380/tcp"
      - "53443:53443/tcp"
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
    environment:
      - DNS_SERVER_DOMAIN=10w.nl
      - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns
    volumes:
      - config:/etc/dns
      - logs:/var/log/technitium/dns
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dns.rule=Host(`dns.10w.nl`)"
      - "traefik.http.routers.dns.tls.certResolver=cloudflare"
      - "traefik.http.services.dns.loadbalancer.server.port=5380"
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    external: true

volumes:
  config:
  logs:
